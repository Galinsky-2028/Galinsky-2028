name: Campaign application CI
on:
  push:
    branches:
      - main
      - build/campaign-foundation
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g28test
          POSTGRES_PASSWORD: g28local
          POSTGRES_DB: g28test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U g28test -d g28test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://g28test:g28local@127.0.0.1:5432/g28test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies from committed lockfile
        run: npm ci --no-fund
      - name: Checkout immutable published E2EESA 1.0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Galinsky-Labs/End-To-End-Everywhere-Security-Architecture-Standard
          ref: b137a3d1cb54900204ff13c7694ed00a50c00141
          path: .e2eesa-upstream
          persist-credentials: false
      - name: Verify entire E2EESA 1.0 source manifest and selected profile/implementation pins
        run: node security/verify-e2eesa-release.mjs .e2eesa-upstream
      - name: Repeat seeded protected-envelope parser adversarial checks
        run: node --test tests/e2eesa-mls-mutational.test.mjs
      - name: Syntax, publishing boundary, TypeScript
        run: npm run check && npm run lint && npm run format:check && npm run secrets:check && npm run typecheck
      - name: Unit tests
        run: npm test
      - name: HTTP, worker and PostgreSQL integration
        run: npm run test:api
      - name: Build Astro and React applications
        run: npm run build
      - name: Generate complete unsigned web/portal executable closure
        run: node security/web-release-closure.mjs test-results/security/web-release-closure.json
      - name: Retain source-bound web release closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galinsky-2028-web-closure
          path: test-results/security/web-release-closure.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify public first-render byte budgets
        run: npm run perf:budget
      - name: Preserve public static preview for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galinsky-2028-public-preview
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
      - name: Cache Playwright browser downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Browser engines and dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real HTTP browser journeys
        run: npm run test:browser && npm run test:public-browser && npm run test:coordination-browser
      - name: Individual reviewer browser accounts
        run: npm run test:review-browser
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: galinsky-2028-browser-evidence
          path: |
            test-results/browser/
            test-results/public-interactions/
            test-results/coordination-browser/
            test-results/review-browser/
          if-no-files-found: ignore
          retention-days: 7
