name: One-shot campaign dependency security repair
on:
  push:
    branches:
      - fix/volunteer-card-links-20261101
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Pin patched Fastify without altering unrelated dependency majors
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact fastify@5.12.7
      - name: Pin patched Vite in development dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --save-dev vite@8.3.5
      - name: Apply safe production dependency updates
        run: npm audit fix --omit=dev --package-lock-only --ignore-scripts --no-fund
      - name: Verify reproducible installation and production security audit
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/one-shot-dependency-fix.yml
          git commit -m "Repair audited dependency versions and preserve reproducible lockfile"
          git push origin HEAD:fix/volunteer-card-links-20261101
