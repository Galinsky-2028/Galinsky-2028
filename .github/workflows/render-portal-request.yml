name: Provision actual volunteer portal in exact Render project
on:
  push:
    branches: [main]
    paths:
      - ops/render-portal-request.json
permissions:
  contents: read
concurrency:
  group: galinsky-volunteer-portal-exact-project
  cancel-in-progress: false
jobs:
  exact-project:
    if: github.repository == 'neophilism/Galinsky-2028' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      G28_RENDER_API_KEY: ${{ secrets.G28_RENDER_API_KEY }}
      G28_PREVIEW_ACCESS_PASSWORD: ${{ secrets.G28_PREVIEW_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Execute exact authorized portal request
        run: node scripts/render-portal-request.mjs
