# PRIVATE preview only. Describes the two existing connected-account services
# (workspace tea-dbl0kcbm8hqs738ptf3g, created 9 November 2026):
#   galinsky2028-website     srv-dbp6n18m7kps73a0kpsg
#   galinsky2028-volunteers  srv-dbp6n661egvs73b7pspg
# This file documents their configuration; do NOT apply it as a new Blueprint,
# which would create duplicate services. Deploy only an exact verified commit
# manually (automatic deploy is off). A static/CDN deployment of dist/web would
# bypass password protection and is not authorized. Free plans only.
# Every secret is `sync: false`: set it privately in Render, never in source.
# Launch-gated flags stay false until their activation evidence exists; see
# docs/OWNER_LAUNCH_INPUTS.md and docs/operations/CONNECTED_WORKSPACE_20261109.md.
services:
  - type: web
    runtime: node
    name: galinsky2028-website
    repo: https://github.com/Galinsky-2028/Galinsky-2028
    branch: main
    plan: free
    region: ohio
    autoDeployTrigger: off
    buildCommand: npm ci --no-fund && npm run build:web
    startCommand: npm run preview:serve
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: ASTRO_TELEMETRY_DISABLED
        value: "1"
      - key: G28_PUBLIC_MODE
        value: preview
      - key: PREVIEW_ACCESS_USER
        value: preview
      - key: PREVIEW_ACCESS_PASSWORD
        sync: false

  - type: web
    runtime: node
    name: galinsky2028-volunteers
    repo: https://github.com/Galinsky-2028/Galinsky-2028
    branch: main
    plan: free
    region: ohio
    autoDeployTrigger: off
    buildCommand: npm ci --no-fund && npm run build:portal
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://galinsky2028-website.onrender.com
      - key: PORTAL_ORIGIN
        value: https://galinsky2028-volunteers.onrender.com
      - key: PREVIEW_ACCESS_USER
        value: preview
      - key: PREVIEW_ACCESS_PASSWORD
        sync: false
      # Neon project calm-moon-73214448, database galinsky2028, restricted runtime login.
      - key: DATABASE_URL
        sync: false
      - key: VOLUNTEER_PASSKEYS_ENABLED
        value: "true"
      # Requires a verified sender, RESEND_API_KEY, RESEND_WEBHOOK_SECRET, MAIL_FROM
      # and MAIL_WORKER_OPERATIONAL_APPROVED=true after a real delivery test.
      - key: MAIL_PROVIDER
        value: disabled
      - key: SIGNUP_ENABLED
        value: "false"
      # Requires named staff identities and the staff passkey/MFA setup.
      - key: STAFF_IDENTITY_ENABLED
        value: "false"
      # Requires actual staff, named recipient keys/fingerprints, a selected recovery
      # policy and the protected-release activation evidence (docs/security/RELEASE_GATES.md).
      - key: PROTECTED_CONTENT_ENABLED
        value: "false"
      # Stripe TEST mode only until treasurer release and campaign-specific underwriting.
      - key: DONATIONS_ENABLED
        value: "false"
